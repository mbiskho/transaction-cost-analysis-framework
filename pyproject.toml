[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-cost-analysis-framework"
version = "0.1.0"
description = "Dependency-free arrival-price transaction cost analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tca = "transaction_cost_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
